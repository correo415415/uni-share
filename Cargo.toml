[package]
name = "uni-share"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hybrid file sharing: encrypted LAN transfers (mDNS + TLS 1.3) and global links via storage.to / Smash"
license = "MIT"
repository = "https://github.com/correo415415/uni-share"
default-run = "uni-share"

[[bin]]
name = "uni-share"
path = "src/main.rs"

[lib]
name = "uni_share"
path = "src/lib.rs"
# `cdylib` is what Android loads (`libuni_share.so`, built with `cargo ndk`); it is
# harmless for desktop builds (one extra artefact) and keeps a single crate.
crate-type = ["rlib", "cdylib"]

[dependencies]
# --- async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"

# --- CLI / UI ---
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
indicatif = "0.18"
console = "0.16"
dialoguer = "0.12"
qrcode = { version = "0.14", default-features = false }

# --- errors / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- serialization / config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"

# --- networking (LAN) ---
axum = { version = "0.8", features = ["json", "query", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
mdns-sd = "0.21"
hostname = "0.4"
local-ip-address = "0.6"

# --- HTTP client (LAN + global) ---
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset", "cookies"] }
url = "2"
percent-encoding = "2"
mime_guess = "2"

# --- integrity / crypto ---
blake3 = { version = "1", features = ["rayon"] }
hex = "0.4"
base64 = "0.22"
ring = "0.17"
rand = "0.9"
crc32fast = "1"

# --- storage ---
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

# --- fs / compression ---
walkdir = "2"
tar = "0.4"
zstd = "0.13"
tempfile = "3"
bytesize = "2"
regex = "1"

# --- native desktop GUI (optional; `cargo build --features slint`) ---
# Skia renderer: proper glyph hinting/subpixel positioning (femtovg's GPU atlas
# smeared small text). femtovg stays as a fallback via SLINT_BACKEND=winit-femtovg.
slint = { version = "1.9", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-femtovg", "accessibility"] }
# rfd: keep zbus on its own async-io executor (the `tokio` feature would force every zbus
# user — accesskit AT-SPI on the winit thread, notify-rust — to require a tokio reactor).
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# --- desktop-only integrations (clipboard, D-Bus/WinRT notifications, OS trust store) ---
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false }
notify-rust = "4"
rustls-platform-verifier = "0.6"

# --- Android: no OS trust-store bridge without a JVM → bundled Mozilla roots ---
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[features]
default = []
# Native Slint window (`uni-share app`). Needs system libs on Linux: libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev.
slint = ["dep:slint", "dep:rfd", "dep:image", "dep:slint-build"]

[build-dependencies]
slint-build = { version = "1.9", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false
